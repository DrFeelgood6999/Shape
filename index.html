<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shape">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>Shape Inexplicável</title>
<link rel="icon" href="app.ico">
<style>
:root{
  --bg:#0b0c0e; --panel:#15161a; --panel2:#1c1e22; --line:#292c32; --line2:#363a41;
  --txt:#e8eaed; --mut:#9aa1aa; --silver:#c9ced4; --silver-hi:#f2f4f6; --silver-lo:#858c95;
  --red:#e0182d; --red2:#ff3448; --red-dk:#9b0e1d; --glow:rgba(224,24,45,.35);
  --metal:linear-gradient(180deg,#f6f7f9 0%,#d6dadf 36%,#9ea5ad 52%,#c6cbd1 70%,#eef0f3 100%);
  --redgrad:linear-gradient(180deg,#ff3e51 0%,#e0182d 48%,#a90f1e 100%);
  --fh:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);font-size:14px;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(224,24,45,.10),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,rgba(201,206,212,.06),transparent 60%),var(--bg);}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,#18191d,#0f1013);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.brand .t1{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:.08em;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t2{font-family:var(--fh);font-size:10.5px;letter-spacing:.28em;color:var(--red2);margin-top:4px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--mut);text-align:left;font-family:var(--fh);font-size:14.5px;letter-spacing:.03em;border-left:3px solid transparent;transition:.15s}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{color:var(--silver-hi);background:rgba(255,255,255,.03)}
.nav.on{color:var(--silver-hi);background:linear-gradient(90deg,rgba(224,24,45,.22),rgba(224,24,45,0));border-left-color:var(--red)}
.nav.on svg{stroke:var(--red2)}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--silver-lo);font-size:11.5px;line-height:1.5}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--red),rgba(224,24,45,.0) 40%,rgba(201,206,212,.35) 70%,transparent)}
.top h1{margin:0;font-family:var(--fh);font-weight:700;font-size:24px;letter-spacing:.04em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--mut);font-size:12.5px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.saved{font-size:12px;color:var(--silver-lo);transition:.3s}
.saved.warn{color:#ff7d8a}
.view{flex:1;overflow:auto;padding:24px 28px 60px}
/* Cards & layout */
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.cols{display:flex;gap:18px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:linear-gradient(180deg,#191a1e,#141518);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.25);min-width:0}
.card h3{margin:0 0 14px;font-family:var(--fh);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver);display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--redgrad);box-shadow:0 0 10px var(--glow)}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:"Segoe UI",sans-serif;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.hero{background:linear-gradient(135deg,rgba(224,24,45,.16),rgba(224,24,45,0) 45%),linear-gradient(180deg,#1b1c20,#141518)}
.hero h2{margin:4px 0 14px;font-family:var(--fh);font-size:30px;letter-spacing:.02em}
.eyebrow{font-family:var(--fh);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--red2)}
.mut{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.big{font-family:var(--fh);font-size:34px;font-weight:700;letter-spacing:.01em;color:var(--silver-hi)}
.big small{font-size:15px;color:var(--mut);font-weight:400;margin-left:4px}
.delta{font-size:12.5px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--silver)}
.delta.down{color:#7fdc9a;background:rgba(80,200,120,.10)}.delta.up{color:#ff7d8a;background:rgba(224,24,45,.12)}
.note{background:rgba(201,206,212,.07);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--silver);font-size:12.5px;margin:10px 0}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:12px}
/* Buttons & inputs */
.btn{border:1px solid #8f969e;border-radius:9px;padding:8px 14px;cursor:pointer;font-family:var(--fh);letter-spacing:.04em;font-size:13.5px;color:#15171a;background:var(--metal);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 8px rgba(0,0,0,.35);transition:.12s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.red{background:var(--redgrad);color:#fff;border-color:#ff5163;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 16px var(--glow)}
.btn.ghost{background:transparent;color:var(--silver);border-color:var(--line2);box-shadow:none}
.btn.ghost:hover{border-color:var(--silver-lo);color:var(--silver-hi)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.icon{padding:5px 8px;min-width:30px}
.btn.danger{background:transparent;border-color:rgba(224,24,45,.4);color:#ff7d8a;box-shadow:none}
.btn.danger:hover{background:rgba(224,24,45,.12)}
input,select,textarea{background:#0e0f12;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,24,45,.15)}
input[type=number]{width:84px}
input[type=date]{color-scheme:dark}
select{color-scheme:dark}
textarea{width:100%;resize:vertical;min-height:58px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
label.tg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--silver);cursor:pointer}
label.tg input{accent-color:var(--red);width:16px;height:16px}
/* Checkbox */
.chk{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--silver-lo);background:#0e0f12;display:inline-grid;place-items:center;cursor:pointer;font-style:normal;font-weight:700;color:#fff;font-size:14px;transition:.12s;padding:0}
.chk:hover{border-color:var(--silver)}
.chk.on{background:var(--redgrad);border-color:var(--red2);box-shadow:0 0 12px var(--glow)}
.chk.x{background:#2a2d33;border-color:#4a4f57;color:var(--mut)}
/* Tables */
table.t{width:100%;border-collapse:collapse}
table.t th{font-family:var(--fh);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver-lo);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t input[type=number]{width:74px}
table.t input,table.t select{padding:6px 7px}
table.t td{padding-left:5px;padding-right:5px}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.done td{background:rgba(224,24,45,.05)}
table.t tfoot td{border-top:1px solid var(--line2);font-weight:600;color:var(--silver-hi)}
/* Bars */
.bar{margin:10px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.bar .lb b{color:var(--silver-hi);font-weight:600}
.bar .tr{height:9px;background:#0e0f12;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--redgrad);border-radius:6px;box-shadow:0 0 10px var(--glow);transition:width .3s}
.bar .fl.over{background:var(--metal)}
/* Week / calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:#101114;border:1px solid var(--line);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--mut);font-size:11.5px}
.wd:hover{border-color:var(--line2)}
.wd.today{border-color:var(--silver-lo)}
.wd small{font-size:9.5px;color:var(--red2);height:11px;letter-spacing:.05em;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-family:var(--fh);font-size:11px;letter-spacing:.1em;color:var(--silver-lo);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:9px;background:#101114;border:1px solid var(--line);cursor:pointer;position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;font-size:12px;color:var(--mut);transition:.12s}
.cal .d:hover{border-color:var(--silver-lo)}
.cal .d.blank{background:none;border:0;cursor:default}
.cal .d.pl::after{content:"";position:absolute;right:6px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--silver-lo)}
.cal .d.fui{background:var(--redgrad);border-color:var(--red2);color:#fff;box-shadow:0 0 12px rgba(224,24,45,.25)}
.cal .d.fui::before{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;padding-top:6px}
.cal .d.faltei{background:#24262b;border-color:#3f444b;color:var(--mut)}
.cal .d.faltei::before{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:15px;padding-top:6px;color:#8a9099}
.cal .d.today{outline:2px solid var(--silver);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:#101114;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--fh);font-size:22px;color:var(--silver-hi)}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
/* Session */
.exblock{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:#121316}
.exblock.complete{border-color:rgba(224,24,45,.5);box-shadow:inset 3px 0 0 var(--red)}
.exhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.exhead .nm{font-family:var(--fh);font-size:16px;color:var(--silver-hi);letter-spacing:.02em}
.badge{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--silver)}
.badge.red{border-color:rgba(224,24,45,.5);color:#ff8d99;background:rgba(224,24,45,.08)}
.exlist{list-style:none;padding:0;margin:0 0 16px}
.exlist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.exlist li b{font-family:var(--fh);color:var(--silver);font-weight:600}
/* Exercise catalog */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:#101114;cursor:pointer;font-size:12px;color:var(--silver)}
.chip:hover{border-color:var(--silver-lo)}
.chip.on{background:var(--redgrad);border-color:var(--red2);color:#fff}
.excards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.exc{background:#121316;border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.exc:hover{border-color:var(--line2)}
.exc .nm{font-family:var(--fh);font-size:15.5px;color:var(--silver-hi)}
.exc .tip{font-size:12px;color:var(--mut);line-height:1.45}
.exc .used{display:flex;flex-wrap:wrap;gap:4px}
.exc .used span{font-size:10.5px;color:var(--silver-lo);background:#0e0f12;border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.exc .acts{display:flex;gap:6px;margin-top:auto}
/* Anatomia */
.fig{display:block;width:100%;height:auto}
.fig .sil{fill:#7f868f;stroke:#4a5058;stroke-width:1}
.fig .head{fill:url(#headG);stroke:#5d646c;stroke-width:.8}
.fig .skin{fill:url(#skinG);stroke:#6b727a;stroke-width:.6}
.fig .ln{fill:none;stroke:#6b727a;stroke-width:.7;stroke-linecap:round}
.fig .mu{fill:url(#mDef);stroke:#7a8189;stroke-width:.6;transition:fill .15s}
.fig.click .mu{cursor:pointer}
.fig.click .mu:not(.p):not(.s):hover{fill:url(#mHov)}
.fig .mu.s{fill:url(#mS);stroke:#d48a93}
.fig .mu.p{fill:url(#mP);stroke:#b8424f;filter:url(#mGlow)}
.fig .fib{fill:url(#fib);pointer-events:none}
.fig text{fill:var(--silver-lo);font-family:var(--fh);font-size:11px;letter-spacing:.2em}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin:10px 0}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mlegend i.dp{background:linear-gradient(135deg,#f8a1aa,#d9505f);box-shadow:0 0 8px rgba(236,111,125,.5)}.mlegend i.ds{background:#f7c9ce}
.mlegend i.dn{background:#eef0f2}
.exc{cursor:pointer}.exc.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px rgba(224,24,45,.18)}
.excrow{display:flex;gap:12px;align-items:flex-start}.excfig{width:96px;flex:none}
.exc .mus{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.4}.exc .mus b{color:#f28b95;font-weight:600}
.exwrap{display:flex;gap:14px;align-items:flex-start}.exfig{width:108px;flex:none;padding-top:4px}
.herow{display:flex;gap:24px;align-items:flex-start}.herofig{width:240px;flex:none}
.dayfoot{display:flex;gap:14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.dayfig{width:120px;flex:none}
.mfig{max-width:560px;margin:6px auto 0}
.modal.wide{width:min(760px,94vw)}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 0%,rgba(224,24,45,.14),transparent 60%),var(--bg);z-index:100}
.gate .box{max-width:560px;text-align:center;padding:30px}
.gate h1{font-family:var(--fh);font-size:30px;margin:16px 0 10px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate p{color:var(--mut);line-height:1.6}
/* Programs */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:16px}
.day .dh{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.day .dh input.nm{flex:1;font-family:var(--fh);font-size:15px}
table.prog td{padding:6px 4px}table.prog input{width:100%!important}table.prog .btn.icon{min-width:26px;padding:4px 6px}
.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:#121316;border:1px solid var(--line);margin:6px 0;font-size:13px;color:var(--mut);line-height:1.45}
.alert>div{flex:1}.alert b{color:var(--silver-hi)}.alert.red{border-color:rgba(224,24,45,.45);background:rgba(224,24,45,.07)}.alert.pr{border-color:rgba(242,139,149,.35)}
.prb{font-size:10px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.cal .d.meio{background:linear-gradient(135deg,#ff3e51 0%,#e0182d 50%,#2a2d33 50%,#24262b 100%);border-color:#8a2a35;color:#fff}
.cal .d.meio::before{content:"½";position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;padding-top:6px}
.chk.half{background:linear-gradient(135deg,#ff3e51 0%,#e0182d 50%,#2a2d33 50%);border-color:#c23a48}
.meal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#121316}
.meal .mh{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.meal .mn{font-family:var(--fh);font-size:15.5px;color:var(--silver-hi);font-weight:600}.meal .mt{color:var(--mut);font-size:12.5px}
.fi{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:9px;border:1px solid transparent;margin:3px 0}
.fi:hover{border-color:var(--line2)}.fi.eat{background:rgba(224,24,45,.06);border-color:rgba(224,24,45,.25)}
.fi .fsel{flex:1;min-width:180px}.fi .fname{flex:1;min-width:180px;color:var(--silver);font-size:13px}
.fi .fq{width:76px}.fi .fu{width:58px;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fm{width:230px;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}.fi .fm b{color:var(--silver-hi)}
.fadd{display:flex;gap:8px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line2)}.fadd input:first-child{flex:1}.fadd input[type=number]{width:90px}
.bars2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
/* Timer */
.timerwrap{display:grid;grid-template-columns:minmax(360px,1fr) minmax(320px,440px);gap:18px}
.ring{position:relative;width:340px;height:340px;margin:10px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ph{font-family:var(--fh);letter-spacing:.25em;text-transform:uppercase;color:var(--red2);font-size:14px}
.ring .tm{font-family:var(--fh);font-size:78px;font-weight:700;color:var(--silver-hi);line-height:1.05;font-variant-numeric:tabular-nums}
.ring .rd{color:var(--mut);font-size:13px}
.ring .nmT{color:var(--silver);font-size:13px;margin-bottom:4px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#121316;margin-bottom:8px}
.preset .nm{font-family:var(--fh);color:var(--silver-hi);font-size:14.5px}
.mini{position:fixed;right:22px;bottom:22px;background:linear-gradient(180deg,#1d1f23,#141518);border:1px solid var(--red);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 18px var(--glow);z-index:40;cursor:pointer}
.mini.show{display:flex}
.mini .tm{font-family:var(--fh);font-size:26px;font-weight:700;color:var(--silver-hi);font-variant-numeric:tabular-nums}
.mini .ph{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--red2)}
/* Nuvem */
.syncbox .row{margin-top:8px}.syncst{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--silver)}

function clMsg(j,r){const m=j.error_description||j.msg||j.message||j.error||('erro '+r.status);

async function clReq(method,qs,body,retry){const c=CLOUD.cfg;const tk=await clToken(retry);

  if(r.status===401&&!retry)return clReq(method,qs,body,true);
  if(r.status===409)throw new ConflictErr('conflito');
  if(!r.ok){const j=await clJSON(r);const m=clMsg(j,r);throw new Error(/relation|does not exist|42P01/.test(m)?'A tabela shape_data não existe: rode o script SQL no Supabase.':/permission denied|42501/.test(m)?'Sem permissão na tabela: rode o script SQL completo (inclui o GRANT).':m)}

const J=x=>x===undefined?'§u':JSON.stringify(x);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
function mergeVal(b,l,r,depth){
  const jl=J(l),jr=J(r),jb=J(b);if(jl===jr)return l;if(jl===jb)return r;if(jr===jb)return l;
  if(depth<=3&&isObj(l)&&isObj(r)){const bb=isObj(b)?b:{};const o={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{const v=mergeVal(bb[k],l[k],r[k],depth+1);if(v!==undefined)o[k]=v});return o}
  if(depth<=3&&Array.isArray(l)&&Array.isArray(r)&&[...l,...r].every(x=>isObj(x)&&x.id)){const bb=Array.isArray(b)?b:[];const by=(a,id)=>a.find(x=>x&&x.id===id);
    const ids=[...r.map(x=>x.id),...l.map(x=>x.id).filter(id=>!by(r,id))];return ids.map(id=>mergeVal(by(bb,id),by(l,id),by(r,id),depth+1)).filter(x=>x!==undefined)}
  return l;
}

async function cloudSync(){
  if(!clReady()||!S)return;if(CLOUD.busy){CLOUD.again=true;return}
  if(!navigator.onLine){CLOUD.state='offline';setStatus();return}
  CLOUD.busy=true;CLOUD.state='sync';setStatus();const startRev=CLOUD.rev;
  for(let attempt=0;attempt<4;attempt++){
  try{
    const rows=await clReq('GET',`?select=data,saved_at&user_id=eq.${CLOUD.cfg.uid}`);
    const remote=rows&&rows[0]?rows[0].data:null,ver=rows&&rows[0]?rows[0].saved_at:null;
    let base=null;try{base=JSON.parse(localStorage.getItem(BASE_KEY)||'null')}catch(e){}
    const dirty=localStorage.getItem(CDIRTY)==='1';let next=null,force=false;
    if(remote&&(!base||remote.savedAt!==base.savedAt)){
      if(!base){
        if(S._seedOnly||!dirty)next=remote;
        else if(remote._seedOnly){next=null;force=true}
        else next=confirm(`Já existem dados na nuvem (salvos em ${new Date(remote.savedAt||0).toLocaleString('pt-BR')}).\n\nOK = usar os dados da nuvem neste aparelho\nCancelar = enviar os dados deste aparelho para a nuvem`)?remote:(force=true,null);
      }else if(dirty){next=merge3(base,S,remote);next.savedAt=Date.now()}
      else next=remote;
    }
    if(next){S=next;normalize();if(IS_PC)await push();else cacheLocal(false);softRender()}
    const needPush=!remote||force||(next!==remote&&(dirty||next));
    if(needPush){if(!S.savedAt)S.savedAt=Date.now();const snap=JSON.stringify(S);if(remote)await clReq('PATCH',`?user_id=eq.${CLOUD.cfg.uid}&saved_at=eq.${ver}`,`{"saved_at":${S.savedAt},"data":${snap}}`);
      else await clReq('POST','',`[{"user_id":"${CLOUD.cfg.uid}","saved_at":${S.savedAt},"data":${snap}}]`);
      localStorage.setItem(BASE_KEY,snap)}
    else localStorage.setItem(BASE_KEY,JSON.stringify(remote));
    if(CLOUD.rev===startRev)localStorage.removeItem(CDIRTY);
    CLOUD.state='ok';CLOUD.err='';CLOUD.lastSync=Date.now();break;
  }catch(e){if(e instanceof ConflictErr&&attempt<3){localStorage.setItem(CDIRTY,'1');continue}if(e instanceof AuthErr){clLogout();CLOUD.state='auth';CLOUD.err='Sessão expirada: entre de novo.'}else{CLOUD.state=navigator.onLine?'err':'offline';CLOUD.err=e.message||String(e)}break}}
  CLOUD.busy=false;setStatus();if(UI.tab==='perfil'&&!$('#ov').classList.contains('show'))softRender();
  if(CLOUD.again){CLOUD.again=false;setTimeout(cloudSync,200)}
}

function exHistory(exId){
  const out=[];
  sortedLogs().forEach(l=>l.entries.filter(e=>e.exId===exId).forEach(e=>{
    let sets=e.sets.filter(s=>s.done&&s.w!==''&&s.r!=='');
    if(!sets.length)sets=e.sets.filter(s=>s.w!==''&&s.r!=='');
    if(!sets.length)return;
    const best=Math.max(...sets.map(s=>e1rm(s.w,s.r))),max=Math.max(...sets.map(s=>Number(s.w)));
    const prev=out.find(o=>o.date===l.date);
    if(prev){prev.e1rm=Math.max(prev.e1rm,best);prev.max=Math.max(prev.max,max)}else out.push({date:l.date,e1rm:best,max});
  }));
  return out;
}

function bestLift(exId,minR){let w=0,r=0,d='';sortedLogs().forEach(l=>l.entries.forEach(e=>{if(e.exId!==exId)return;let sets=e.sets.filter(x=>x.done&&x.w!==''&&x.r!==''&&x.w!=null&&x.r!=null);if(!sets.length)sets=e.sets.filter(x=>x.w!==''&&x.r!==''&&x.w!=null&&x.r!=null);
  sets.forEach(x=>{if(+x.r>=(minR||1)&&(+x.w>w||(+x.w===w&&+x.r>r))){w=+x.w;r=+x.r;d=l.date}})}));return{w,r,d}}

function niceStep(range){const raw=range/4||1;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
let CH={};
function lineChart(series,o={}){
  const pts=series.flatMap(s=>s.points);
  if(!pts.length)return `<div class="empty">${o.empty||'Sem dados ainda.'}</div>`;
  const id=uid();CH[id]={t:'line',series,o};
  const lg=series.length>1?`<div class="lg">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:'';
  return `<div class="chart">${lg}<div data-c="${id}" style="height:${o.h||260}px"></div></div>`;
}
function drawLine(series,o,W){
  const H=o.h||260,L=48,R=20,T=16,B=30;
  const pts=series.flatMap(s=>s.points);
  const xs=pts.map(p=>parseD(p.x).getTime());let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  const ys=pts.map(p=>+p.y);if(o.goal)ys.push(o.goal);let y0=Math.min(...ys),y1=Math.max(...ys);
  const pd=(y1-y0)*0.15||Math.max(1,Math.abs(y1)*0.05);y0-=pd;y1+=pd;if(Math.min(...ys)>=0&&y0<0)y0=0;
  const st=niceStep(y1-y0);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g='';const nY=Math.round((y1-y0)/st);
  for(let k=0;k<=nY;k++){const v=y0+k*st;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`}
  const ux=[...new Set(xs)].sort((a,b)=>a-b);let ticks=ux;if(ux.length>6){ticks=[];for(let i=0;i<6;i++)ticks.push(ux[Math.round(i*(ux.length-1)/5)])}
  ticks.forEach(t=>{g+=`<text class="ax" x="${X(t)}" y="${H-8}" text-anchor="middle">${fmtDM(iso(new Date(t)))}</text>`});
  if(o.goal){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="#c9ced4" stroke-dasharray="6 5" stroke-width="1.3" opacity=".7"/><text class="vl" x="${W-R}" y="${Y(o.goal)-6}" text-anchor="end">Meta ${fmtN(o.goal)} ${o.unit||''}</text>`}
  const gid='g'+uid();let body='';
  series.forEach((s,si)=>{
    const ps=s.points.slice().sort((a,b)=>a.x<b.x?-1:1);if(!ps.length)return;
    const d=ps.map((p,i)=>`${i?'L':'M'}${X(parseD(p.x).getTime()).toFixed(1)},${Y(+p.y).toFixed(1)}`).join('');
    if(si===0&&ps.length>1)body+=`<path d="${d}L${X(parseD(ps[ps.length-1].x).getTime()).toFixed(1)},${H-B}L${X(parseD(ps[0].x).getTime()).toFixed(1)},${H-B}Z" fill="url(#${gid})"/>`;
    body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    body+=ps.map(p=>`<circle cx="${X(parseD(p.x).getTime()).toFixed(1)}" cy="${Y(+p.y).toFixed(1)}" r="4.2" fill="#0b0c0e" stroke="${s.color}" stroke-width="2.2"><title>${fmtD(p.x)} — ${s.name}: ${fmtN(+p.y,1)} ${o.unit||''}</title></circle>`).join('');
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0182d" stop-opacity=".32"/><stop offset="1" stop-color="#e0182d" stop-opacity="0"/></linearGradient></defs>${g}${body}</svg>`;
}
function barChart(labels,vals,o={}){const id=uid();CH[id]={t:'bar',labels,vals,o};return `<div class="chart"><div data-c="${id}" style="height:${o.h||240}px"></div></div>`}
function drawBar(labels,vals,o,W){
  const H=o.h||240,L=48,R=20,T=18,B=30,n=labels.length;
  const mx=Math.max(1,...vals,o.target||0)*1.15;const st=niceStep(mx);const y1=Math.ceil(mx/st)*st;
  const Y=v=>T+(1-v/y1)*(H-T-B);const bw=(W-L-R)/n;let g='';
  for(let k=0;k<=Math.round(y1/st);k++){const v=k*st;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`}
  const gid='b'+uid();
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,y=Y(v);
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-B-y)}" rx="4" fill="url(#${gid})"><title>${labels[i]}: ${fmtN(v)} ${o.unit||''}</title></rect>`;
    if(v>0)g+=`<text class="vl" x="${x+w/2}" y="${y-5}" text-anchor="middle">${fmtN(v)}</text>`;
    if(bw>=38||i%2===0)g+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  if(o.target)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="#c9ced4" stroke-dasharray="6 5" stroke-width="1.3" opacity=".75"/><text class="vl" x="${W-R}" y="${Y(o.target)-6}" text-anchor="end">Meta ${fmtN(o.target)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3e51"/><stop offset="1" stop-color="#9b0e1d"/></linearGradient></defs>${g}</svg>`;
}

const LEG_GROUPS=['Quadríceps','Posterior','Glúteos','Panturrilha'];
const repTop=r=>{const m=String(r||'').match(/\d+/g);return m?+m[m.length-1]:null};
function lastEntry(exId,before){for(const l of sortedLogs().reverse()){if(before&&l.date>=before)continue;const e=l.entries.find(e=>e.exId===exId);if(e&&e.sets.some(s=>s.w!==''&&s.w!=null&&s.r!==''&&s.r!=null))return{date:l.date,e}}return null}
function bestSet(sets){let b=null;sets.forEach(s=>{if(s.w===''||s.r===''||s.w==null||s.r==null)return;const v=e1rm(s.w,s.r);if(!b||v>b.v)b={w:+s.w,r:+s.r,v}});return b}
function progItem(exId){const p=activeProgram();for(const d of (p?p.days:[])){const it=d.items.find(i=>i.exId===exId);if(it)return it}return null}
function suggest(exId,item,before){
  item=item||progItem(exId);const ex=exById(exId);const inc=ex&&LEG_GROUPS.includes(ex.group)?5:2.5;
  const le=lastEntry(exId,before);
  if(!le){const w=item&&item.load!==''&&item.load!=null?+item.load:null;return{w,why:w!=null?'Carga inicial do programa':'Sem registros ainda',up:false}}
  let sets=le.e.sets.filter(s=>s.done&&s.w!==''&&s.r!=='');if(!sets.length)sets=le.e.sets.filter(s=>s.w!==''&&s.r!=='');
  const w=Math.max(...sets.map(s=>+s.w));const top=repTop(item?item.reps:le.e.target);const need=item?+item.sets:le.e.sets.length;
  const atW=sets.filter(s=>+s.w===w);
  if(top&&atW.length>=need&&atW.every(s=>+s.r>=top))return{w:w+inc,why:`Bateu ${top} reps em todas as séries com ${fmtN(w)} kg: suba ${fmtN(inc)} kg`,up:true};
  return{w,why:top?`Repita ${fmtN(w)} kg até fazer ${top} reps em todas as séries`:`Repita ${fmtN(w)} kg`,up:false};
}

function histTable(exId){
  if(!exId)return '';const rows=[];let prev=null;
  sortedLogs().forEach(l=>{const e=l.entries.find(x=>x.exId===exId);if(!e)return;let sets=e.sets.filter(s=>s.done&&s.w!==''&&s.r!=='');if(!sets.length)sets=e.sets.filter(s=>s.w!==''&&s.r!=='');if(!sets.length)return;
    const b=bestSet(sets);const vol=sets.reduce((a,s)=>a+(+s.w)*(+s.r),0);rows.push({date:l.date,b,n:sets.length,reps:sets.map(s=>s.r).join(' · '),vol,d:prev?b.v-prev:null});prev=b.v});
  if(!rows.length)return '';
  return `<table class="t" style="margin-top:14px"><tr><th>Data</th><th>Melhor série</th><th>Séries (reps)</th><th class="num">Volume</th><th class="num">1RM est.</th><th class="num">Variação</th></tr>
   ${rows.reverse().slice(0,10).map(r=>`<tr><td>${fmtD(r.date)}</td><td><b style="color:var(--silver-hi)">${fmtN(r.b.w)} kg × ${r.b.r}</b></td><td class="mut">${r.n} (${esc(r.reps)})</td><td class="num">${fmtN(r.vol)} kg</td><td class="num">${fmtN(r.b.v,1)} kg</td>
     <td class="num">${r.d==null?'<span class="mut">—</span>':`<span class="delta ${r.d>0.05?'down':r.d<-0.05?'up':''}">${r.d>0?'+':''}${fmtN(r.d,1)} kg</span>`}</td></tr>`).join('')}</table>`;
}
function progTable(){
  const p=S.programs.find(x=>x.id===UI.progTable)||activeProgram();if(!p)return '<div class="empty">Sem programa ativo.</div>';
  const rows=p.days.flatMap(d=>d.items.map(it=>({d,it})));if(!rows.length)return '<div class="empty">Programa sem exercícios.</div>';
  return `<table class="t"><tr><th>Exercício</th><th>Dia</th><th class="num">Início</th><th class="num">Última sessão</th><th class="num">Melhor 1RM</th><th class="num">Evolução</th><th class="num">Próxima carga</th></tr>
   ${rows.map(({d,it})=>{const h=exHistory(it.exId);const first=h[0],last=h[h.length-1];const le=lastEntry(it.exId);const lb=le?bestSet(le.e.sets.filter(s=>s.w!==''&&s.r!=='')):null;
     const start=first?first.max:(it.load!==''&&it.load!=null?+it.load:null);const evo=first&&last?last.max-first.max:null;const sg=suggest(it.exId,it);const pr=h.length?Math.max(...h.map(x=>x.e1rm)):null;
     return `<tr style="cursor:pointer" onclick="A.chartEx('${it.exId}');$('#view').scrollTop=0" class="${UI.chartEx===it.exId?'done':''}"><td><b style="color:var(--silver-hi);font-weight:600">${esc(exName(it.exId))}</b><div class="mut small">${it.sets} × ${esc(it.reps)}</div></td>
      <td class="mut small">${esc(d.name.split('—')[0].trim())}</td>
      <td class="num">${start!=null?fmtN(start)+' kg':'—'}</td>
      <td class="num">${lb?`${fmtN(lb.w)} kg × ${lb.r}<div class="mut small">${fmtDM(le.date)}</div>`:'<span class="mut">—</span>'}</td>
      <td class="num">${pr?fmtN(pr,1)+' kg':'—'}</td>
      <td class="num">${evo==null?'<span class="mut">—</span>':`<span class="delta ${evo>0?'down':evo<0?'up':''}">${evo>0?'+':''}${fmtN(evo)} kg${start?` (${evo>0?'+':''}${fmtN(evo/start*100,0)}%)`:''}</span>`}</td>

function printDoc(html){
  if(IS_WEB&&(matchMedia('(max-width:900px)').matches||'ontouchstart' in window)){
    const bar='<div class="noprint" style="position:sticky;top:0;background:#141518;padding:10px;display:flex;gap:10px;justify-content:center;z-index:9"><button onclick="print()" style="background:#e0182d;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px">Imprimir / Salvar PDF</button></div><style>@media print{.noprint{display:none!important}}</style>';
    const doc=html.replace('<body>','<body>'+bar).replace('</body>','<script>setTimeout(function(){try{print()}catch(e){}},700)<\/script></body>');
    const url=URL.createObjectURL(new Blob([doc],{type:'text/html'}));const w=window.open(url,'_blank');if(!w)location.href=url;return}
  let f=document.getElementById('printFrame');if(f)f.remove();
  f=document.createElement('iframe');f.id='printFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);const d=f.contentDocument;d.open();d.write(html);d.close();
  toast('Na janela que abrir, escolha “Salvar como PDF” em Destino.');
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},400);
}

  updTimer()},200);

const OFF={busy:false,res:[],err:'',q:'',ctx:null,mi:null,br:true,last:0};

function offMacros(p){const n=p.nutriments||{};let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;
  return{kcal:Math.round(+kcal||0),p:+(+n.proteins_100g||0).toFixed(1),c:+(+n.carbohydrates_100g||0).toFixed(1),g:+(+n.fat_100g||0).toFixed(1),has:kcal!=null}}
function offMicros(p){const n=p.nutriments||{},o={};NUTR.forEach(([k,,,,,,off,f])=>{const v=n[off+'_100g'];if(v!==undefined&&v!==''&&!isNaN(+v))o[k]=+(+v*f).toPrecision(4)});return o}
function offCat(p,m){const nm=(offName(p)+' '+offBrand(p)).toLowerCase();
  if(/refrigerante|suco|bebida|cerveja|água|energ[eé]tico|isot[oô]nico|ch[aá] /.test(nm))return'Bebida';
  if(/leite|iogurte|queijo|requeij|coalhada|kefir/.test(nm))return'Laticínio';
  if(/whey|prote[ií]na em p[oó]|creatina|suplemento/.test(nm))return m.p>=50?'Proteína':'Suplemento';

    else{try{const j=await offFetch(`${offHost()}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&sort_by=unique_scans_n&fields=${OFF_FIELDS}`);ps=j.products||[]}
      catch(e){if(/limitou/.test(e.message))throw e;const j=await offFetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=30&langs=pt&fields=${OFF_FIELDS}`);ps=j.hits||[]}}

function bodyW(){const ms=measSorted().filter(m=>+m.peso>0);return ms.length?+ms[ms.length-1].peso:0}
function maxReps(exId){let r=0;S.logs.forEach(l=>l.entries.forEach(e=>{if(e.exId!==exId)return;e.sets.forEach(s=>{if(s.r!==''&&s.r!=null&&(s.done||s.w===''||s.w==null||+s.w===0))r=Math.max(r,+s.r)})}));return r}
function rankLift(L){const ex=S.exercises.find(e=>e.name===L.name);if(!ex)return{L,val:0,lvl:-1};const bw=bodyW();
  const val=L.type==='reps'?maxReps(ex.id):bestE1rm(ex.id);if(!val||(L.type==='ratio'&&!bw))return{L,ex,val:0,lvl:-1};
  const x=L.type==='reps'?val:val/bw;let lvl=0;L.t.forEach((th,i)=>{if(x>=th)lvl=i});const next=L.t[lvl+1];
  const frac=next!=null?(x-L.t[lvl])/(next-L.t[lvl]):1;const need=next!=null?(L.type==='reps'?Math.ceil(next-x):Math.ceil((next*bw-val)/2.5)*2.5):0;
  return{L,ex,val,x,lvl,frac,need,next}}

  const main=rs.filter(r=>r.lvl>=0);const avg=main.length?main.reduce((a,r)=>a+r.lvl+Math.min(.99,r.frac),0)/main.length:0;
  const bw=bodyW();const big=['Supino','Agachamento','Levantamento terra'].map(n=>rs.find(r=>r.L.label===n)).filter(r=>r&&r.val);
  const power=bw?Math.round(big.reduce((a,r)=>a+r.val,0)/bw*1000):0;return{rs,overall:main.length?Math.floor(avg):-1,avg,power,bw}}

     <div class="rk-n">${nx}</div></div>`}).join('');

/* ============ Modal / toast ============ */
function showModal(h,wide){$('#modal').innerHTML=h;$('#modal').classList.toggle('wide',!!wide);$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
let toastT;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2200)}

/* ============ Ações ============ */
const findDay=id=>{for(const p of S.programs){const d=p.days.find(d=>d.id===id);if(d)return d}return null};
const A={
  // presença
  cycleDay(d){const c=S.attendance[d];if(!c)S.attendance[d]='fui';else if(c==='fui')S.attendance[d]='meio';else if(c==='meio')S.attendance[d]='faltei';else delete S.attendance[d];save();render()},
  calNav(n){const [y,m]=UI.calMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);UI.calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()},
  startToday(){openSession(today());save();go('treinos')},
  // sessão
  sessDate(v){if(!v)return;openSession(v);UI.calMonth=v.slice(0,7);save();render()},
  sessDay(v){const log=S.logs.find(l=>l.date===S.draft.date&&l.dayId===v);if(log){S.draft=clone(log);S.draft.fromLog=true}else S.draft=buildDraft(S.draft.date,v);save();render()},
  setSet(ei,si,k,v){S.draft.entries[ei].sets[si][k]=num(v);
    if(k==='w'){S.draft.entries[ei].sets.forEach((s,j)=>{if(j>si&&!s.done&&(s.w===''||s.w==null))s.w=num(v)})}
    save();render()},
  toggleSet(ei,si){const e=S.draft.entries[ei],s=e.sets[si];s.done=!s.done;
    if(s.done&&s.r===''){const m=String(e.target||'').match(/\d+/g);if(m)s.r=+m[m.length-1]}
    if(IS_WEB&&s.done&&S.settings.autoRest!==false&&e.rest>0&&!(si===e.sets.length-1&&ei===S.draft.entries.length-1))A.tQuick(e.rest,true);
    save();render()},
  addSet(ei){const e=S.draft.entries[ei],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:'',done:false});save();render()},
  delSet(ei){const e=S.draft.entries[ei];if(e.sets.length>1)e.sets.pop();save();render()},
  subOpen(ei){const D=S.draft,e=D.entries[ei];UI.subQ='';const day=findDay(D.dayId);const inProg=day&&day.items.some(i=>i.exId===e.exId);const done=e.sets.filter(x=>x.done).length;
    showModal(`<h3>Trocar “${esc(exName(e.exId))}”</h3>
     <p class="mut small" style="margin:-6px 0 10px">Equivalentes que trabalham os mesmos músculos, os mais parecidos primeiro.${done?` As ${done} séries já feitas ficam registradas no exercício original; as restantes passam para o novo.`:''}</p>
     <input placeholder="Buscar outro exercício..." oninput="UI.subQ=this.value;$('#subList').innerHTML=subListHTML(${ei})" style="width:100%;margin-bottom:10px">
     ${inProg?`<label class="tg" style="margin-bottom:10px"><input type="checkbox" id="subPerm">Trocar também no programa (vale para os próximos treinos de “${esc(day.name)}”)</label>`:''}
     <div id="subList" style="max-height:52vh;overflow:auto">${subListHTML(ei)}</div>
     <div class="row end" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`,true)},
  subDo(ei,newId){const D=S.draft,e=D.entries[ei],oldId=e.exId;const perm=$('#subPerm')&&$('#subPerm').checked;
    const done=e.sets.filter(x=>x.done),left=e.sets.filter(x=>!x.done);const n=Math.max(1,done.length?left.length:e.sets.length);
    const it={exId:newId,sets:n,reps:e.target,rest:e.rest,load:''};const sg=sugFor(it,D.date);
    const ne={exId:newId,rest:e.rest,target:e.target,subFor:e.subFor||oldId,sug:sg,sets:[...Array(n)].map(()=>({w:sg.w!=null?sg.w:'',r:'',done:false}))};
    if(done.length&&left.length){e.sets=done;D.entries.splice(ei+1,0,ne)}else if(done.length){D.entries.splice(ei+1,0,ne)}else D.entries[ei]=ne;
    if(perm){const day=findDay(D.dayId);if(day)day.items.forEach(i=>{if(i.exId===oldId){i.exId=newId;i.load=''}})}
    save();closeModal();render();toast(`Trocado por ${exName(newId)}${perm?' (também no programa)':''}.`)},
  delEntry(ei){if(!confirm('Remover este exercício da sessão?'))return;S.draft.entries.splice(ei,1);save();render()},

  exSave(id){const o={name:$('#mN').value.trim(),group:$('#mG').value,equip:$('#mE').value.trim(),notes:$('#mT').value.trim(),muscles:clone(UI.mm)};if(!o.name)return toast('Dê um nome ao exercício.');if(!o.muscles.p.length)return toast('Marque pelo menos um músculo principal no boneco.');
    if(id)Object.assign(exById(id),o);else{if(UI.newSrc){o.src=UI.newSrc;o.img=UI.newImg}S.exercises.push({id:uid(),...o})}UI.newSrc=null;UI.newImg=null;save();closeModal();render();toast(o.src?'Exercício adicionado ao seu catálogo.':'Exercício salvo.')},
  exDel(id){const u=usedIn(id);if(!confirm(u.length?`Este exercício está em: ${u.join(', ')}. Excluir e remover dos programas?`:'Excluir este exercício do catálogo?'))return;
    S.exercises=S.exercises.filter(e=>e.id!==id);S.programs.forEach(p=>p.days.forEach(d=>d.items=d.items.filter(i=>i.exId!==id)));S.goals=S.goals.filter(g=>g.exId!==id);save();render()},
  exAssign(id){const p=activeProgram();
    showModal(`<h3>Atribuir “${esc(exName(id))}”</h3><div class="fg">
      <label class="f full">Programa<select id="aP" onchange="A.assignProg(this.value)">${S.programs.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label class="f full">Dia<select id="aD">${p.days.map(d=>`<option value="${d.id}">${esc(d.name)}${d.weekday!==''&&d.weekday!=null?' — '+WD_LONG[d.weekday]:''}</option>`).join('')}</select></label>
      <label class="f">Séries<input id="aS" type="number" value="3" min="1"></label><label class="f">Repetições<input id="aR" value="8-12"></label>
      <label class="f">Descanso (s)<input id="aT" type="number" value="90" step="15"></label><label class="f">Carga inicial (kg)<input id="aL" type="number" step="0.5" value="${lastWeight(id)??''}"></label></div>
      <div class="row end" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="A.assignSave('${id}')">Adicionar ao dia</button></div>`)},
  assignProg(pid){const p=S.programs.find(x=>x.id===pid);$('#aD').innerHTML=p.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')},
  assignSave(id){const d=findDay($('#aD').value);if(!d)return toast('Crie um dia no programa primeiro.');d.items.push({id:uid(),exId:id,sets:+$('#aS').value||3,reps:$('#aR').value||'8-12',rest:+$('#aT').value||90,load:num($('#aL').value)});save();closeModal();render();toast(`Adicionado em ${d.name}.`)},
  // programas
  progSel(id){UI.progId=id;render()},
  progRename(v){S.programs.find(p=>p.id===UI.progId).name=v||'Programa';save();render()},
  progActivate(){S.activeProgramId=UI.progId;S.draft=null;save();render();toast('Programa ativo alterado.')},
  progNew(){const p={id:uid(),name:'Novo programa',days:[{id:uid(),name:'Dia 1',weekday:'',items:[]}]};S.programs.push(p);UI.progId=p.id;save();render()},
  progDup(){const p=clone(S.programs.find(x=>x.id===UI.progId));p.id=uid();p.name+=' (cópia)';p.days.forEach(d=>{d.id=uid();d.items.forEach(i=>i.id=uid())});S.programs.push(p);UI.progId=p.id;save();render()},
  progDel(){if(S.programs.length<2)return toast('Mantenha pelo menos um programa.');if(!confirm('Excluir este programa?'))return;S.programs=S.programs.filter(p=>p.id!==UI.progId);if(S.activeProgramId===UI.progId){S.activeProgramId=S.programs[0].id;S.draft=null}UI.progId=S.activeProgramId;save();render()},
  dayAdd(){const p=S.programs.find(x=>x.id===UI.progId);p.days.push({id:uid(),name:`Dia ${p.days.length+1}`,weekday:'',items:[]});save();render()},
  dayDel(id){if(!confirm('Excluir este dia de treino?'))return;const p=S.programs.find(x=>x.id===UI.progId);p.days=p.days.filter(d=>d.id!==id);save();render()},
  dayEdit(id,k,v){const d=findDay(id);d[k]=k==='weekday'?(v===''?'':+v):v;save();if(k==='weekday')render()},
  itemEdit(did,iid,k,v){const it=findDay(did).items.find(i=>i.id===iid);it[k]=k==='reps'||k==='exId'?v:num(v);save()},
  itemMove(did,iid,dir){const d=findDay(did),i=d.items.findIndex(x=>x.id===iid),j=i+dir;if(j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];save();render()},
  itemDel(did,iid){const d=findDay(did);d.items=d.items.filter(i=>i.id!==iid);save();render()},
  itemAdd(did){const id=document.getElementById('add-'+did).value;findDay(did).items.push({id:uid(),exId:id,sets:3,reps:'8-12',rest:90,load:lastWeight(id)??''});save();render()},
  // perfil
  prof(k,v){S.profile[k]=k==='nome'||k==='objetivo'?v:(+v||'');save();render()},
  measAdd(){const t=today();if(S.meas.some(m=>m.date===t))return toast('Já existe uma medição hoje — edite a linha na tabela.');const l=measSorted().pop()||{};S.meas.push({id:uid(),date:t,...Object.fromEntries(MEAS.map(([k])=>[k,l[k]??'']))});save();render();toast('Nova medição criada com os últimos valores. Ajuste o que mudou.')},
  measEdit(id,k,v){const m=S.meas.find(x=>x.id===id);m[k]=k==='date'?v:num(v);save();render()},
  measDel(id){if(!confirm('Excluir esta medição?'))return;S.meas=S.meas.filter(m=>m.id!==id);save();render()},
  goalAdd(){S.goals.push({id:uid(),exId:S.exercises[0].id,target:100,base:''});save();render()},
  goalEdit(id,k,v){const g=S.goals.find(x=>x.id===id);g[k]=k==='exId'?v:(+v||0);if(k==='exId')g.base='';save();render()},
  goalDel(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()},
  goalLAdd(){(S.goalsLift=S.goalsLift||[]).push({id:uid(),exId:S.exercises[0].id,target:100,reps:1});save();render()},
  goalLEdit(id,k,v){const g=S.goalsLift.find(x=>x.id===id);g[k]=k==='exId'?v:(+v||(k==='reps'?1:0));save();render()},
  goalLDel(id){S.goalsLift=S.goalsLift.filter(g=>g.id!==id);save();render()},
  weighIn(){const w=num($('#pwW').value),d=$('#pwD').value||today();if(!w||w<30||w>300)return toast('Digite um peso válido em kg.');
    const before=rankAll().rs.map(r=>r.lvl);const m=S.meas.find(x=>x.date===d);
    if(m)m.peso=w;else S.meas.push({id:uid(),date:d,...Object.fromEntries(MEAS.map(([k])=>[k,k==='peso'?w:'']))});
    save();render();const up=rankAll().rs.filter((r,i)=>r.lvl>before[i]&&r.lvl>0);toast(up.length?`Peso atualizado: ${fmtN(w,1)} kg. ⚡ Transformação! ${up.map(r=>r.L.label+': '+FORMS[r.lvl].n).join(' · ')}`:`Peso atualizado: ${fmtN(w,1)} kg.`,up.length?6000:2200)},
  exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`shape-backup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup exportado para a pasta de downloads.')},
  importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.exercises||!d.programs)throw 0;if(!confirm('Substituir todos os dados atuais por este backup?'))return;S=d;normalize();save();render();toast('Backup importado.')}catch(e){toast('Arquivo de backup inválido.')}inp.value=''};r.readAsText(f)},
  resetAll(){if(!confirm('Apagar TODOS os dados e voltar ao plano inicial? Exporte um backup antes.'))return;S=seed();normalize();save();render();toast('Dados reiniciados.')}
};
function mmText(){const M=UI.mm||{p:[],s:[]};return `<span style="color:#f28b95">Principal: ${esc(mNames(M.p))||'—'}</span> · <span style="color:var(--silver)">Secundário: ${esc(mNames(M.s))||'—'}</span>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
</script>
</body>
</html>
